server:
  address: ":8080"
  read_header_timeout: "5s"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  shutdown_timeout: "5s"
  max_inflight: 0
  rate_limit_rps: 0

strategy:
  type: round_robin

targets:
  - id: api_1
    address: "api_1:9001"
    weight: 3

  - id: api_2
    address: "api_2:9002"
    weight: 2

  - id: api_3
    address: "api_3:9003"
    weight: 1

health:
  enabled: true
  interval: "2s"
  timeout: "1s"
  mode: tcp
  path: "/health"

metrics:
  enabled: true
  address: ":9090"

logging:
  level: info
  format: text

retry_attempts: 1
