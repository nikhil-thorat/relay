server:
  address: ":42069"
  read_header_timeout: "5s"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  shutdown_timeout: "5s"
  max_inflight: 0
  rate_limit_rps: 0

strategy:
  type: round_robin

targets:
  - id: api_1
    address: "localhost:9001"
    weight: 1

  - id: api_2
    address: "localhost:9002"
    weight: 1

health:
  enabled: true
  interval: "10s"
  timeout: "5s"
  mode: tcp
  path: "/health"

metrics:
  enabled: true
  address: ":9090"

logging:
  level: info
  format: text

retry_attempts: 1
